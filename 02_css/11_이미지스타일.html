<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image-container {
            width: 400px;
            height: 300px;
            border: 2px solid black;
            overflow: hidden; 
        }

        .image {
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-fit: fill;  
            object-fit: contain; 
            object-fit: none; 
            object-fit: scale-down; 
        }

    </style>
</head>
<body>
    <div class="image-container">
        <img src="sample/image/flower1.PNG" alt="flower" class="image">
    </div>
</body>
</html>
