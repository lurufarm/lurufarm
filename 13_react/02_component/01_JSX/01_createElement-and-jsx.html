<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        
        // createElement 방식
        function CreateElementComponent()
        {
            return React.createElement
            (
                "div",
                null,
                React.createElement("h1", {className:"greeting"}, "Hello"),
                React.createElement("h3", null, "JSX 없이 렌더링")
            );
        }

        // JSX 방식
        function JSXComponent()
        {
            return (
                <div>
                    <h1 className="greeting" id="greeting">Hello, JSX</h1>
                    <h3 id="name">JSX를 활용한 렌더링</h3>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<JSXComponent />);

    </script>
</body>
</html>
