<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">

        const user = {
            firstName: 'panda',
            lastName: 'Kwon',
            phone: '010-1234-5678'
        };
        const formatName = (user) => `${user.lastName} ${user.firstName}`;

        const handleClick = () => {
            alert('이벤트가 잘 연결되었습니다!');
        };

        const style = {
            backgroundColor: 'black',
            color: 'white',
            padding: '10px',
            cursor: 'pointer'
        };

        const element = (
            // 최상위 element(<>)는 하나만 있어야 한다.
            <>
                <h2>hello JSX</h2>
                {/* 표현식 사용, JSX 문법 내에 중괄호를 이용하여 javascript 표현식을 넣을 수 있다. */}
                <h3>이름: {formatName(user)}</h3>
                
                {/* 속성 & 이벤트: html에서는 class를 썼지만, jsx에서는 className, 그리고 onclick같은 것도 카멜케이스로 작성 */}
                <h4 id="title" className="highlight" onClick={handleClick}>클릭 시 알림 발생</h4>

                {/* 인라인 스타일, HTML에서 style은 문자열이지만, JSX에서는 객체로 사용 */}
                <p style={style}>인라인 스타일이 적용된 텍스트입니다.</p>
            </>
        );

        ReactDOM.createRoot(document.getElementById("root")).render(element);

    </script>
</body>
</html>
