<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_use id</title>
    <style>
        .area {
            width: 100px;
            height: 100px;
            border: 1px solid lightgray;
        }
    </style>
</head>
<body>
    <h1>01. id를 이용한 요소 노드 취득</h1>
    <pre>
    <b>Document.prototype.getElementById 메서드는 인수로 전달한 id 어트리뷰트 값을 갖는 하나의 요소 노드를 탐색하여 반환한다.</b>
    문서 내에 중복된 id 값을 갖는 HTML 요소가 여러 개 존재하더라도 에러가 발생하지는 않지만 해당 id 값을 갖는 첫 번째 요소 노드만 반환한다. 
    </pre>

    <div id="area1" class="area">
        div 영역
        <p id="area2">p 영역</p>
    </div>
    <div id="area1" class="area">
        div 영역
    </div>
    <script>
        // 요소 노드 취득
        const $elem = document.getElementById('area1');
        // 관습적으로 요소 노드를 취득할 때마다 $를 표시해준다. 사실 없어도 됨
        console.log($elem);

        // 요소의 스타일 속성을 이용하여 배경색 변경
        $elem.style.backgroundColor = 'pink';

        // let area2 = 10; // 이렇게 area2를 이상한 값으로 만들어버리면, 이전 id와 충돌해서 아래의 코드가 발동하지 않음
        // id 속성 값을 그대로 딴 전역 변수를 이용한 접근도 가능하다.
        area2.style.backgroundColor = 'blue';

        // id 값을 갖는 HTML 요소가 존재하지 않는 경우 null 반환
        const $noElem = document.getElementById('area3');
        console.log($noElem);
        
    </script>
</body>
</html>
