<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[실습]3_폼관련태그</title>
</head>

<body>
    <h1>회원가입</h1>
    <form action="#" method="post">
        <fieldset>
            <table>
                <legend>필수 입력 사항</legend>
                <tr>
                    <th>ID</th>
                    <td>
                        <input id="userid" type="text" name="userID" size="25"
                        placeholder="아이디 10글자 이상">
                    <input type="button" value="중복 확인"></td>
                </tr>
                <tr>
                    <th>비밀번호</th>
                    <td><input id="userpw" type="password" name="userPW" size="30" placeholder="영문, 숫자, 특수문자 포함 8자 이상">
                    </td>
                </tr>
                <tr>
                    <th>비밀번호 확인</th>
                    <td><input id="userpw" type="password" name="userPW" size="30" </tr>
                <tr>
                    <th>Email</th>
                    <td><input id="useremail" type="email" name="userEMAIL" size="25">
                    <select name="email">
                            <option value="">직접입력</option>
                            <option value="@naver.com">@naver.com</option>
                            <option value="@gmail.com">@gmail.com</option>
                            <option value="@daum.net">@daum.net</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
    <form action="#" method="post">
        <fieldset>
            <legend>추가 정보</legend>
            <label>프로필 사진: </label>
            <input type="file" name="profilepicture">

            <br><br>

            <label>성별: </label>
            <input id="male" type="radio" name="gender" value="M" checked>
            <label for="male">남자</label>
            <input id="female" type="radio" name="gender" value="F">
            <label for="female">여자</label>

            <br><br>

            <label for="birthday">생년월일: </label>
            <input id="birthday" type="date" name="birthday">

            <br><br>

            <label>취미</label>
            <br>
            <input id="baseball" type="checkbox" name="hobby" value="baseball">
            <label for="baseball">야구</label>
            <input id="basketball" type="checkbox" name="hobby" value="basketball">
            <label for="basketball">농구</label>
            <input id="football" type="checkbox" name="hobby" value="football">
            <label for="football">축구</label>
            <br>
            <input id="study" type="checkbox" name="hobby" value="study" checked>
            <label for="study">공부</label>
            <input id="listeningToMusic" type="checkbox" name="hobby" value="listeningToMusic">
            <label for="listeningToMusic">음악감상</label>
            <br>
            <input id="etc" type="checkbox" name="hobby" value="etc">
            <label for="etc">기타</label>
            <input type="text" name="hobby">

            <br><br>

            <label for="introduce">자기소개</label>
            <br>
            <textarea name="introduce" id="introduce" cols="50" rows="4" style="resize:none"></textarea>
            <br>
        </fieldset>
        <br>
        <button type="submit">회원가입</button>
        <button type="reset">다시입력</button>
        <button type="button">이전으로</button>
    </form>
</body>

</html>
