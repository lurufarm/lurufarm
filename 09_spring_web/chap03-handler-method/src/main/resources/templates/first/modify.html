<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <h1>@RequestParam을 이용하여 전달된 파라미터 꺼내기</h1>

  <h3>메뉴 수정하기</h3>
<!--  이 경우 /modify라고 작성할 시 절대경로로 인식해서 /first/modift가 아닌 그냥 /modify가 되어버림 -->
  <form action="modify" method="post">
    수정할 메뉴의 이름: <input type="text" name="modifyName"/><br>
    수정할 메뉴의 가격: <input type="text" name="modifyPrice"/><br>
    <button type="submit">수정하기</button>
  </form>

  <h3>메뉴 수정(한꺼번에)</h3>
  <form action="modifyAll" method="post">
      수정할 메뉴의 이름: <input type="text" name="modifyNameAll"/><br>
      수정할 메뉴의 가격: <input type="text" name="modifyPriceAll"/><br>
      <button type="submit">수정하기</button>
  </form>

</body>
</html>
